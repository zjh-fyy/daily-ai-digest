name: Daily AI & Global Digest

on:
  schedule:
    # 主调度：UTC 16:47 = 北京时间 00:47
    # 结合 GitHub Actions 11 月实测排队延迟 (5h10m~8h36m)，实际执行与送达落在北京时间 06:00~09:20
    - cron: '47 16 * * *'
    # 兜底补发调度：UTC 23:13 = 北京时间 07:13（若主调度偶发丢单则自动补发；若当天已发过，main.py 幂等防重锁 1 秒跳过不重发）
    - cron: '13 23 * * *'
  workflow_dispatch: # 支持手动点击运行，或由外部准点定时器（如 cron-job.org / Cloudflare Worker 每天 08:10）秒级唤醒
    inputs:
      force_send:
        description: '今日已发送过时，是否强制重新生成并重发'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Digest Script
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          CODEX_BASE_URL: ${{ secrets.CODEX_BASE_URL }}
          CODEX_MODEL: ${{ secrets.CODEX_MODEL || 'gpt-6.2-sol' }}
          CODEX_EFFORT: ${{ secrets.CODEX_EFFORT || 'medium' }}
          AIZEX_API_KEY: ${{ secrets.AIZEX_API_KEY }}
          AIZEX_BASE_URL: ${{ secrets.AIZEX_BASE_URL }}
          AIZEX_MODEL: ${{ secrets.AIZEX_MODEL || 'gpt-6.2-sol' }}
          AIZEX_EFFORT: ${{ secrets.AIZEX_EFFORT || 'medium' }}
          LOCAL_LLM_API_KEY: ${{ secrets.LOCAL_LLM_API_KEY }}
          LOCAL_LLM_BASE_URL: ${{ secrets.LOCAL_LLM_BASE_URL }}
          LOCAL_LLM_MODEL: ${{ secrets.LOCAL_LLM_MODEL }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          READER_PROFILE: ${{ secrets.READER_PROFILE }}
          FORCE_SEND: ${{ inputs.force_send || 'false' }}
        run: |
          python -B main.py

      # 把当天早报与去重记录提交回仓库，否则云端每次都是全新环境，看不到前几天推荐过的项目
      - name: Archive Digest History
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git rm --cached --ignore-unmatch preview_digest.md
          git add prebuilt/
          if git diff --cached --quiet; then
            echo "no history changes"
          else
            git commit -m "chore: archive digest $(TZ=Asia/Shanghai date +%F)"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Upload Digest Artifact (Backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-digest-preview
          path: preview_digest.md
          if-no-files-found: ignore
          retention-days: 7
