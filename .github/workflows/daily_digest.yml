name: Daily AI & Global Digest

on:
  schedule:
    # GitHub Actions 定时调度 (UTC 20:07 = 北京时间 04:07)
    # 提前至凌晨触发，应对 GitHub Actions 约 4.5~5 小时的排队延迟，确保在早上 08:30~09:15 稳妥准时送达！
    - cron: '7 20 * * *'
  workflow_dispatch: # 支持在 GitHub 仓库 Actions 页面手动点击 "Run workflow" 随时测试
    inputs:
      primary_engine:
        description: '选择本次运行的主力引擎 (Primary Engine)'
        required: false
        default: 'codex'
        type: choice
        options:
          - codex
          - aizex
          - local

permissions:
  contents: write

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Digest Script
        env:
          PRIMARY_ENGINE: ${{ inputs.primary_engine || secrets.PRIMARY_ENGINE || 'codex' }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          CODEX_BASE_URL: ${{ secrets.CODEX_BASE_URL }}
          CODEX_MODEL: ${{ secrets.CODEX_MODEL || 'gpt-6.1-sol' }}
          CODEX_EFFORT: ${{ secrets.CODEX_EFFORT || 'high' }}
          AIZEX_API_KEY: ${{ secrets.AIZEX_API_KEY }}
          AIZEX_BASE_URL: ${{ secrets.AIZEX_BASE_URL }}
          AIZEX_MODEL: ${{ secrets.AIZEX_MODEL || 'gpt-6.1-sol' }}
          AIZEX_EFFORT: ${{ secrets.AIZEX_EFFORT || 'high' }}
          LOCAL_LLM_API_KEY: ${{ secrets.LOCAL_LLM_API_KEY }}
          LOCAL_LLM_BASE_URL: ${{ secrets.LOCAL_LLM_BASE_URL }}
          LOCAL_LLM_MODEL: ${{ secrets.LOCAL_LLM_MODEL }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python main.py

      # 把当天早报与去重记录提交回仓库，否则云端每次都是全新环境，看不到前几天推荐过的项目
      - name: Archive Digest History
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git rm --cached --ignore-unmatch preview_digest.md
          git add prebuilt/
          if git diff --cached --quiet; then
            echo "no history changes"
          else
            git commit -m "chore: archive digest $(TZ=Asia/Shanghai date +%F)"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Upload Digest Artifact (Backup)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: daily-digest-preview
          path: preview_digest.md
          retention-days: 7
